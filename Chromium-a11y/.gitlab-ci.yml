# ---------------------------------------------------------------------------
# Tests d'accessibilite (WCAG 2.1 AA / RGAA 4.1)
#
# Fichiers attendus a la racine du depot :
#   .pa11yci.json    configuration des pages et des regles
#   rgaa-report.js   traduction du rapport vers la nomenclature RGAA
#   - le port, qui doit etre identique dans PORT_TEST et dans les URLs
#     de .pa11yci.json
#
# A adapter par projet :
#   - la commande de build, si le site est genere (Vite, Hugo, Jekyll...)
#   - le dossier servi par "serve" (. ou dist ou public)
#   - la liste des URLs dans .pa11yci.json
# ---------------------------------------------------------------------------

accessibilite:
  stage: test
  image: registry.gitlab.com/gitlab-ci-utils/gitlab-pa11y-ci:latest

  variables:
    DOSSIER_SERVI: "."
    PORT_TEST: "3000"

  script:
    - npx --yes serve "$DOSSIER_SERVI" -l "$PORT_TEST" &
    - npx --yes wait-on "http://localhost:$PORT_TEST" --timeout 60000
    - pa11y-ci --config .pa11yci.json || PA11Y_STATUS=$?
    - node rgaa-report.js --json rgaa-summary.json
    - exit ${PA11Y_STATUS:-0}
  allow_failure: true

  artifacts:
    when: always
    expose_as: "Rapport accessibilite"
    paths:
      - pa11y-html/
      - pa11y-report.json
      - rgaa-summary.json
    expire_in: 5 days

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
